plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.tvlauncher.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvlauncher.home'
        minSdk 19          // Android 4.4
        targetSdk 19
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
